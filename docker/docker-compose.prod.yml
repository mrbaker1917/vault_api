services:
  caddy:
    image: caddy:2-alpine
    container_name: vault_api_caddy
    restart: unless-stopped
    ports:
      - "${HTTPS_HOST_PORT:-443}:443"
      - "${HTTP_HOST_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vault_api_app
    restart: unless-stopped
    environment:
      PORT: "8080"
      APP_ENV: "production"
      AUTO_MIGRATE: "true"
      MIGRATIONS_DIR: "/app/migrations"
      DATABASE_URL: "postgres://vault:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/vault_api?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-https://localhost}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:17
    container_name: vault_api_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vault_api
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vault_api"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    container_name: vault_api_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  purge:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vault_api_purge
    restart: unless-stopped
    command: ["crond", "-f", "-l", "2"]
    environment:
      DATABASE_URL: "postgres://vault:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/vault_api?sslmode=disable"
      PURGE_RETENTION_DAYS: "${PURGE_RETENTION_DAYS:-30}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
