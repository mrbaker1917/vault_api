services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vault_api_app
    ports:
      - "${APP_HOST_PORT:-8081}:8080"
    environment:
      PORT: "8080"
      APP_ENV: "development"
      AUTO_MIGRATE: "true"
      MIGRATIONS_DIR: "/app/migrations"
      DATABASE_URL: "postgres://vault:vault@postgres:5432/vault_api?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "dev-secret"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:17
    container_name: vault_api_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vault_api
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vault
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vault_api"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    container_name: vault_api_redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data

  purge:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vault_api_purge
    restart: unless-stopped
    command: ["crond", "-f", "-l", "2"]
    environment:
      DATABASE_URL: "postgres://vault:vault@postgres:5432/vault_api?sslmode=disable"
      PURGE_RETENTION_DAYS: "${PURGE_RETENTION_DAYS:-30}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: